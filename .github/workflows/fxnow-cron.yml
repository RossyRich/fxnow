name: collect

on:
  schedule:
    - cron: "*/5 * * * *"   # 約5分ごと（GitHub側の混雑で数分遅れることあり）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run collector
        run: python3 collect/collect.py

      - name: Commit & push if changed
        run: |
          git config user.name "fxnow-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.js data.json
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "data: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main || true
          git push
