name: collect

# GitHubのcronがこのリポジトリで発火しないため「自己連鎖方式」を採用:
# 1回の実行で約30分間・5分ごとに収集し、終了時に自分で次の実行を予約する。
# scheduleは保険として残す（cronが復活すればチェーン切れ時の自動復旧になる）。
on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: collect-loop
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 5分ごとに収集（約30分間・週末は収集せず待機）
        timeout-minutes: 35
        run: |
          git config user.name "fxnow-bot"
          git config user.email "actions@users.noreply.github.com"
          # 為替市場が閉まる 土曜7:00 〜 月曜7:00 JST は収集を休止（連鎖は維持）
          is_closed() {
            dow=$(TZ=Asia/Tokyo date +%u)   # 1=月 … 6=土 7=日
            h=$(TZ=Asia/Tokyo date +%H)
            [ "$dow" = "6" ] && [ "$h" -ge 7 ] && return 0
            [ "$dow" = "7" ] && return 0
            [ "$dow" = "1" ] && [ "$h" -lt 7 ] && return 0
            return 1
          }
          end=$((SECONDS + 1800))
          while [ $SECONDS -lt $end ]; do
            t0=$SECONDS
            if is_closed; then
              echo "週末休場中のため収集スキップ ($(TZ=Asia/Tokyo date '+%m/%d %H:%M JST'))"
            else
              python3 collect/collect.py || true
              git add data.js data.json
              if ! git diff --cached --quiet; then
                git commit -m "data: $(date -u '+%Y-%m-%d %H:%M UTC')"
                git pull --rebase origin main || true
                git push || true
              fi
            fi
            el=$((SECONDS - t0))
            [ "$el" -lt 300 ] && sleep $((300 - el))
          done

      - name: 次の実行を予約（自己連鎖・リトライ付き）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub APIの一時障害(504等)で連鎖が切れないよう最大10回リトライ
          for i in $(seq 1 10); do
            if gh workflow run fxnow-cron.yml -R ${{ github.repository }}; then
              echo "dispatched (try $i)"
              exit 0
            fi
            echo "dispatch failed (try $i) - 30秒後にリトライ"
            sleep 30
          done
          echo "::error::自己連鎖の予約に失敗。毎時cronか手動実行での復旧待ち"
          exit 1
