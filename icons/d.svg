<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- D案: 買い×売りの攻防 — 対向する2本のアロー -->
  <rect width="180" height="180" fill="#0c0f16"/>
  <!-- 対角の分割ライン -->
  <path d="M0 180 L180 0" stroke="#232b3d" stroke-width="2"/>
  <!-- 買い: 左下から右上へ -->
  <path d="M28 130 L74 84 L94 104 L134 64" fill="none" stroke="#ff5c6c" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M112 58 L140 58 L140 86" fill="none" stroke="#ff5c6c" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 売り: 左上から右下へ(細く、拮抗) -->
  <path d="M40 44 L84 88" fill="none" stroke="#4da3ff" stroke-width="9" stroke-linecap="round" opacity=".9"/>
  <path d="M100 120 L128 148" fill="none" stroke="#4da3ff" stroke-width="9" stroke-linecap="round" opacity=".9"/>
  <text x="90" y="170" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="22"
        font-weight="800" letter-spacing="1" fill="#e8ebf2" text-anchor="middle">FX<tspan fill="#ff5c6c">now</tspan></text>
</svg>
